<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="EvlveX">
  <title>EvlveX</title>
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="#B89B6A" stroke-width="5"/>
  <g fill="#B89B6A">
    <!-- top and bottom bars shared by the two mirrored Es -->
    <rect x="25" y="27" width="50" height="7"/>
    <rect x="25" y="66" width="50" height="7"/>
    <!-- back-to-back stems -->
    <rect x="40" y="27" width="7" height="46"/>
    <rect x="53" y="27" width="7" height="46"/>
    <!-- middle arms reaching outward -->
    <rect x="29" y="46.5" width="18" height="7"/>
    <rect x="53" y="46.5" width="18" height="7"/>
  </g>
</svg>
